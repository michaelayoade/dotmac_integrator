name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# The private index. READ credentials only — `ci-reader` holds read:package and
# nothing else. The publish token is deliberately not used here: this repository
# installs from the registry and never writes to it, and a CI job that could
# overwrite a released artefact is a supply-chain risk with no upside.
#
# Poetry reads these from the environment; they are never written to
# pyproject.toml or the lockfile. Same secret name the other Dotmac repos use.
env:
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # This list must equal `make check`'s prerequisites. The Starter learned
      # that the hard way: a matrix naming a subset let committed assets and
      # formatting go unenforced on every PR while `make check` passed locally.
      matrix:
        target: [poetry-lock-check, lint, format-check, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: poetry install
      - run: make ${{ matrix.target }}

  composition:
    runs-on: ubuntu-latest
    # Proves the composed lineages actually apply to a real PostgreSQL, as the
    # owner role, and that the platform-plane contract holds afterwards.
    # Without this the migrations would first run in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrator_test
        # Loopback-bound: a published port on 0.0.0.0 with weak auth is
        # reachable regardless of the host firewall.
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/integrator_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-poetry
      - run: poetry install
      - run: poetry run pytest tests/composition -q

  image:
    runs-on: ubuntu-latest
    # The artefact, audited as an artefact. `make check` proves the source;
    # this proves the thing that actually ships — non-root, no migration on
    # boot, the pinned wheels really installed, and no registry credential in a
    # layer. Without it, all four are first observed in production.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dotmac-integrator:ci
          # The credential is a BuildKit secret, mounted for one RUN. `ARG` and
          # `ENV` both survive into image metadata; this does not.
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_READ_TOKEN }}
      - name: Audit the image
        run: ./scripts/audit_image.sh dotmac-integrator:ci


  # TEMPORARY / UNQUALIFIED: generation only, never merge-acceptance evidence.
  # Remove after the proposed lock is reviewed and committed; rerun normal CI.
  lock-proposal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/provision-runtime-20261027'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Uses the workflow's existing ci-reader environment, never a publisher.
      # Do not use setup-poetry here: its committed-lock check is a validation
      # gate, while this isolated job proposes the dependency-edit lock refresh.
      - name: Bootstrap the hash-locked Poetry toolchain
        shell: bash
        run: |
          bootstrap_venv="${RUNNER_TEMP}/integrator-lock-bootstrap"
          python -m venv "$bootstrap_venv"
          "$bootstrap_venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r .github/bootstrap/poetry-requirements-py312.txt
          export PATH="$bootstrap_venv/bin:$PATH"
          python scripts/check_poetry_toolchain.py --bootstrap .github/bootstrap/poetry-requirements-py312.txt --active
          echo "$bootstrap_venv/bin" >> "$GITHUB_PATH"
      - name: Generate an ordinary lock proposal after publication
        run: poetry lock
      - name: Retain the unqualified lock proposal for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrator-lock-proposal
          path: poetry.lock
          retention-days: 1
          if-no-files-found: error
