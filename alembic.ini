[alembic]
script_location = migrations

# version_locations and sqlalchemy.url are set PROGRAMMATICALLY in
# migrations/env.py — see that module's docstring. They are absent here rather
# than wrong here: a stale placeholder path is worse than none, because Alembic
# would find no revisions and cheerfully report the database already at head.
path_separator = space
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
