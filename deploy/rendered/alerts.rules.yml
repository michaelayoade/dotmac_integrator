# GENERATED by dotmac-deployment-foundation. Do not edit; edit
# deploy/product.toml and re-run `dotmac-deploy render`.
# product dotmac_integrator
#
# Every signal this fires against is already scoped by the resource
# attributes the platform stamps at collection time
# (service.name, deployment.environment, dotmac.product, dotmac.deployment_id, dotmac.release, dotmac.git_sha, dotmac.image_digest, dotmac.host, dotmac.role — see
# dotmac_deployment_foundation.telemetry.RESOURCE_ATTRIBUTES), so the
# foundation expressions below are NOT rewritten with a per-product
# PromQL label selector; splicing one into an arbitrary hand-authored
# expression is error-prone and untestable. The `product` label on
# every rule below is what a dashboard or alert router groups on
# instead.

groups:
  - name: "dotmac_foundation"
    # 42 alert(s) omitted: producer=UNBACKED — no producer emits the metric(s) they read today. See docs/inventories/deployment-foundation-alert-producers.md. Pass include_unbacked=True to render them anyway (each still carries dotmac_unbacked="true").
    rules:
      - alert: "FDN_READINESS_FAILING"
        expr: "probe_success{probe=\"readiness\"} == 0"
        for: "120s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "traffic-cutover safety invariant"
          runbook: "#readiness-failing"
          recovery: "3 consecutive successful probes"
          protects: "traffic-cutover safety invariant"
          dedup_by: "service,instance"
      - alert: "FDN_LIVENESS_FAILING"
        expr: "probe_success{probe=\"liveness\"} == 0"
        for: "120s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "crash-loop prevention"
          runbook: "#liveness-failing"
          recovery: "3 consecutive successful probes"
          protects: "crash-loop prevention"
          dedup_by: "service,instance"
      - alert: "FDN_CONTAINER_OOM_KILLED"
        expr: "increase(container_oom_events_total[5m]) > 0"
        for: "0s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "memory-limit correctness"
          runbook: "#oom-kill"
          recovery: "manual ack (limit is a config decision)"
          protects: "memory-limit correctness"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_CPU_SATURATION"
        expr: "rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "capacity headroom"
          runbook: "#container-cpu-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "capacity headroom"
          dedup_by: "container"
      - alert: "FDN_CONTAINER_MEMORY_SATURATION"
        expr: "container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "OOM-kill prevention"
          runbook: "#container-memory-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "OOM-kill prevention"
          dedup_by: "container"
      - alert: "FDN_HOST_CPU_SATURATION"
        expr: "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (host) > 0.90"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "host capacity headroom"
          runbook: "#host-cpu-saturation"
          recovery: "ratio below threshold for 15m"
          protects: "host capacity headroom"
          dedup_by: "host"
      - alert: "FDN_HOST_MEMORY_SATURATION"
        expr: "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "host OOM prevention"
          runbook: "#host-memory-saturation"
          recovery: "ratio below threshold for 10m"
          protects: "host OOM prevention"
          dedup_by: "host"
      - alert: "FDN_HOST_DISK_LOW"
        expr: "node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.15"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "disk exhaustion"
          runbook: "#disk-low"
          recovery: "free > threshold + hysteresis"
          protects: "disk exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_DISK_CRITICAL"
        expr: "node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "disk exhaustion"
          runbook: "#disk-low"
          recovery: "free > threshold + hysteresis"
          protects: "disk exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_INODES_LOW"
        expr: "node_filesystem_files_free / node_filesystem_files < 0.15"
        for: "900s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "inode exhaustion"
          runbook: "#inode-low"
          recovery: "free > threshold"
          protects: "inode exhaustion"
          dedup_by: "host,mount"
      - alert: "FDN_HOST_CLOCK_SKEW"
        expr: "abs(node_timex_offset_seconds) > 0.5"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "audit-timestamp/TLS validation correctness"
          runbook: "#clock-drift"
          recovery: "offset under threshold"
          protects: "audit-timestamp/TLS validation correctness"
          dedup_by: "host"
      - alert: "FDN_PG_DOWN"
        expr: "pg_up == 0"
        for: "60s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "data-plane availability"
          runbook: "#postgres-down"
          recovery: "pg_up == 1 for 2m"
          protects: "data-plane availability"
          dedup_by: "instance"
      - alert: "FDN_PG_POOL_SATURATION"
        expr: "pg_stat_activity_count / pg_settings_max_connections > 0.80"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "request-serving capacity"
          runbook: "#pg-pool-exhausted"
          recovery: "ratio below 80%"
          protects: "request-serving capacity"
          dedup_by: "instance"
      - alert: "FDN_PG_LONG_TRANSACTION"
        expr: "max(pg_stat_activity_max_tx_duration_seconds) by (instance) > 120"
        for: "300s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "bloat/lock-contention prevention"
          runbook: "#pg-long-transaction"
          recovery: "duration under threshold"
          protects: "bloat/lock-contention prevention"
          dedup_by: "instance"
      - alert: "FDN_PG_REPLICATION_LAG_HIGH"
        expr: "pg_replication_lag_seconds > 60"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "DR/read-replica correctness"
          runbook: "#pg-replication-lag"
          recovery: "lag under threshold"
          protects: "DR/read-replica correctness"
          dedup_by: "instance"
      - alert: "FDN_PG_DISK_LOW"
        expr: "node_filesystem_avail_bytes{mountpoint=\"/var/lib/postgresql/data\"} / node_filesystem_size_bytes{mountpoint=\"/var/lib/postgresql/data\"} < 0.10"
        for: "600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "data-plane disk exhaustion"
          runbook: "#pg-disk-low"
          recovery: "free > threshold"
          protects: "data-plane disk exhaustion"
          dedup_by: "instance"
      - alert: "FDN_REDIS_DOWN"
        expr: "redis_up == 0"
        for: "60s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "cache/queue availability"
          runbook: "#redis-down"
          recovery: "redis_up == 1"
          protects: "cache/queue availability"
          dedup_by: "instance"
      - alert: "FDN_REDIS_MEMORY_HIGH"
        expr: "redis_memory_used_bytes / redis_memory_max_bytes > 0.85"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "eviction risk"
          runbook: "#redis-mem-pressure"
          recovery: "ratio below threshold"
          protects: "eviction risk"
          dedup_by: "instance"
      - alert: "FDN_REDIS_PERSISTENCE_STALE"
        expr: "time() - redis_rdb_last_save_timestamp_seconds > 900"
        for: "600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "data-loss-on-restart exposure"
          runbook: "#redis-persistence-stale"
          recovery: "fresh save observed"
          protects: "data-loss-on-restart exposure"
          dedup_by: "instance"
      - alert: "FDN_TLS_CERT_EXPIRY_WARNING"
        expr: "(probe_ssl_earliest_cert_expiry - time()) / 86400 < 21"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "outage-by-expired-cert prevention"
          runbook: "#tls-expiry"
          recovery: "renewed cert observed"
          protects: "outage-by-expired-cert prevention"
          dedup_by: "hostname"
      - alert: "FDN_TLS_CERT_EXPIRY_CRITICAL"
        expr: "(probe_ssl_earliest_cert_expiry - time()) / 86400 < 7"
        for: "3600s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "outage-by-expired-cert prevention"
          runbook: "#tls-expiry"
          recovery: "renewed cert observed"
          protects: "outage-by-expired-cert prevention"
          dedup_by: "hostname"
      - alert: "FDN_SYNTHETIC_HEALTH_FAILING"
        expr: "probe_success{probe=\"synthetic_health\",product=~\".*\"} == 0"
        for: "300s"
        labels:
          severity: "page"
          owner: "foundation"
          product: "dotmac_integrator"
        annotations:
          summary: "end-to-end reachability"
          runbook: "#synthetic-health-fail"
          recovery: "3 consecutive successes"
          protects: "end-to-end reachability"
          dedup_by: "product"
  - name: "dotmac_product_dotmac_integrator"
    rules:
      - alert: "INTG_RECEIPT_UNDELIVERABLE"
        expr: "integrator_receipts_unavailable_total > 0"
        for: "900s"
        labels:
          severity: "page"
          owner: "integrations"
          product: "dotmac_integrator"
        annotations:
          summary: "Receipts are failing pre-network because a destination is unreconciled"
          runbook: "#integrator-destination-unreconciled"
          recovery: "the destination descriptor reconciles and the counter stops rising"
          protects: "the at-most-once delivery invariant: an unreconciled destination is a pre-network UNAVAILABLE, never a receipt marked done"
          dedup_by: "product,environment,installation"
      - alert: "INTG_IDENTITY_COLLISION"
        expr: "increase(integrator_identity_collision_total[30m]) > 0"
        for: "0s"
        labels:
          severity: "page"
          owner: "integrations"
          product: "dotmac_integrator"
        annotations:
          summary: "Two producers disagree about what a provider said"
          runbook: "#integrator-identity-collision"
          recovery: "no further collisions for 30 minutes and the conflicting producers are reconciled"
          protects: "provider-event identity: a 409 ESCALATES to INDETERMINATE rather than reporting already_applied, because the owning service is saying two producers disagree"
          dedup_by: "product,environment,capability"
      - alert: "INTG_BINDING_DIGEST_UNKNOWN"
        expr: "integrator_binding_manifest_digest_unknown > 0"
        for: "1800s"
        labels:
          severity: "ticket"
          owner: "integrations"
          product: "dotmac_integrator"
        annotations:
          summary: "An installation is pinned to a connector manifest digest nothing publishes"
          runbook: "#integrator-manifest-digest-unknown"
          recovery: "the binding is re-enabled against a published digest, or the connector version is restored"
          protects: "AGENTS.md rule 34: an installation adopts by manifest digest, so a published version's manifest is frozen; an unknown pin means one version named two contracts"
          dedup_by: "product,environment,installation"
      - alert: "INTG_SCHEMA_GRACE_EXPIRING"
        expr: "(integrator_schema_grace_retire_after_timestamp - time()) / 86400 < 14"
        for: "3600s"
        labels:
          severity: "ticket"
          owner: "integrations"
          product: "dotmac_integrator"
        annotations:
          summary: "A capability contract's ungated schema window is closing"
          runbook: "#integrator-schema-grace"
          recovery: "the contract publishes its schemas, or the grace is renewed with a stated reason"
          protects: "ADR-0024 \u00a7 12: a contract that has published nothing yet must SAY so, and the window closes rather than lapsing into silence"
          dedup_by: "product,environment,capability"
      - alert: "INTG_SHADOW_PORT_SETTLING"
        expr: "integrator_shadow_mode_settled_total > 0"
        for: "0s"
        labels:
          severity: "page"
          owner: "integrations"
          product: "dotmac_integrator"
        annotations:
          summary: "A MIRROR-mode deployment settled a receipt, which it must never do"
          runbook: "#integrator-shadow-settled"
          recovery: "manual: the shadow run is stopped and the affected receipts are audited"
          protects: "AGENTS.md rule 26: a shadow run that marked receipts processed would look exactly like a completed cutover while losing every event"
          dedup_by: "product,environment"
