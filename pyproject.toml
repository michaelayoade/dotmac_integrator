[tool.poetry]
name = "dotmac-integrator"
version = "0.1.0a1"
description = "Thin assembly composing dotmac-integration as an independently deployed connector control plane"
authors = ["Dotmac"]
readme = "README.md"
packages = [{ include = "dotmac_integrator", from = "src" }]
# One exact build tool produces the lock, CI environment and runtime image.
# Every installer derives from this value; see scripts/check_poetry_toolchain.py.
requires-poetry = "2.4.1"

# NOT published. This is a deployable application, not a distribution: nothing
# pins it, so a version here is a deployment label rather than a contract. It is
# absent from every release workflow deliberately.
classifiers = ["Private :: Do Not Upload"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# EXACT pins, not floors. A library declares the earliest kernel it can work
# with; a deployment declares the exact one it was tested against. `>=` here
# would let a `poetry install` months from now compose a combination nobody has
# ever run, which is the failure mode an assembly exists to prevent.
#
# Moving a pin is a reviewed diff with its own CI run — see `make outdated`.
dotmac-kernel = "0.1.0a68"
dotmac-integration = "0.1.0a13"

# ── Connectors ──────────────────────────────────────────────────────────────
# Separately released distributions, each contributing exactly ONE connector key
# through the `dotmac_integration.connectors` entry-point group. Installing one
# is the only way it enters; nothing under `src/` names any of them (AGENTS.md
# rule 2), and `tests/architecture/test_pins_are_exact.py` derives its
# parametrisation from this block rather than from a second hand-kept list.
#
# This is the complete published cohort. Installing the distributions makes
# them discoverable; it does not activate or bind any of them. Product-owned
# descriptors still declare the usable capability vocabulary, and the module
# refuses undeclared or unreconciled bindings. Integration a12 is load-bearing:
# one authenticated descriptor is projected onto every durable binding for its
# capability, so overlapping connectors cannot be silently omitted by an
# assembly-maintained binding-id list.
dotmac-connector-whatsapp = "0.1.0a2"
dotmac-connector-meta-social = "0.1.0a1"
dotmac-connector-linkedin = "0.1.0a1"
dotmac-connector-mono = "0.1.0a1"
dotmac-connector-remita = "0.1.0a1"
dotmac-connector-paystack = "0.1.0a2"
dotmac-connector-flutterwave = "0.1.0a2"

fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic-settings = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.8"
mypy = "^1.13"
# Required by `fastapi.testclient`, which is how the operator guard is driven
# per route. A TEST dependency only: nothing under `src/` may import it, and
# `test_secrets_are_held.py` fails the build if the resolution path does.
httpx = "^0.28"
# Stubs only. `test_release_lane.py` reads the release workflow as YAML to
# assert its job structure — the guarantees the lane has that YAML cannot
# state. mypy checks tests here, so the stubs are a dev dependency rather than
# an ignore comment that would also hide a real yaml misuse.
types-PyYAML = "^6.0"

# The private index. `priority = "supplemental"` rather than "primary": the two
# Dotmac distributions resolve here, everything else from PyPI. A primary source
# would make the whole dependency set depend on this host being reachable.
#
# Named `forgejo` to match the fleet's existing convention, so the credential
# env vars are the ones an operator already knows:
# POETRY_HTTP_BASIC_FORGEJO_USERNAME / _PASSWORD. Never in this file.
#
# The identity is `ci-reader` (read:package), NOT the publish token. This
# assembly only ever installs from the index; handing it publish rights would
# give every CI run the ability to overwrite a released artefact.
[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
